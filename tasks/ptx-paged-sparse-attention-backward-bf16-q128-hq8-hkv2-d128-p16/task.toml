schema_version = "1.4"
artifacts = [
  { source = "/app/kernel.ptx", destination = "kernel.ptx" },
]

[task]
name = "ptx-bench/ptx-paged-sparse-attention-backward-bf16-q128-hq8-hkv2-d128-p16"
version = "1.0.0"
description = "Two-entry backward for causal block-sparse GQA over a paged BF16 KV cache on NVIDIA B200."
authors = []
keywords = ["ptx", "b200", "direct-ptx", "attention", "backward", "paged-kv", "block-sparse", "gqa", "multi-entry"]

[metadata]
benchmark_setting = "direct-ptx"
documentation_access = "online-docs"
task_format = "multi-entry-system-correctness"
required_entries = [
  "paged_sparse_attn_bwd_zero_bf16_q128_hq8_hkv2_d128_p16",
  "paged_sparse_attn_bwd_main_bf16_q128_hq8_hkv2_d128_p16",
]
template_version = "direct-ptx-v0.3"
hardware_target = "NVIDIA B200 / sm_100a"
ptx_docs_path = "/opt/ptx-docs"
ptx_validation_tools = ["ptxas", "cuobjdump"]
documentation_tools = ["web-search"]
prohibited_high_level_toolchains = ["nvcc", "NVRTC", "NVVM", "Triton"]
required_gpus = 1
required_gpu_type = "B200"
implementation_status = "in-progress"
release_ready = false

[verifier]
timeout_sec = 1800.0
collect = []

[verifier.env]

[agent]
timeout_sec = 7200.0
network_mode = "no-network"

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
mcp_servers = []

[environment.healthcheck]
command = "/usr/local/bin/direct-ptx-policy-check && /usr/local/bin/direct-ptx-verify-hardware --output /logs/environment/hardware-preflight.json"
interval_sec = 1.0
timeout_sec = 30.0
start_period_sec = 0.0
start_interval_sec = 1.0
retries = 1

[environment.env]

[solution.env]
